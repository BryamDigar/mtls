user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush      on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
    
    # --- Bloque Server para HTTPS (Puerto 443) ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl; # Escucha también en IPv6 para HTTPS

        # Server certificate and key
        ssl_certificate /etc/nginx/test/server/server.crt;
        ssl_certificate_key /etc/nginx/test/server/server.key;

        # CA certificate for client verification (mTLS, si se activa ssl_verify_client)
        ssl_client_certificate /etc/nginx/test/ca/ca.crt;
        ssl_verify_client on; # Actualmente desactivado, permite conexiones HTTPS normales.

        location / {
            # Configura el servidor backend para HTTPS
            proxy_pass http://great_wing:8075;
            # Añade headers para informar al backend sobre la conexión original (HTTPS)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # Indica que la conexión original fue HTTPS
        }
    }

    # --- Bloque Server para HTTP (Puerto 80) ---
    server {
        listen 80; # Escucha en el puerto 80 (HTTP)
        listen [::]:80; # Escucha también en IPv6 para el puerto 80

        # Opcional: Puedes especificar un server_name si lo necesitas (ej. localhost, tu_dominio.com)
        # server_name localhost; 

        location / {
            # Configura el servidor backend para HTTP
            proxy_pass http://great_wing:8075;
            # Añade headers para informar al backend sobre la conexión original (HTTP)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http; # Indica que la conexión original fue HTTP
        }
    }
}
